<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile result dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="m-root">
  <dc-import name="MobileReview" hint-size="390px,844px"></dc-import>
  <div class="m-scrim"></div>

  <div class="m-card" style="position: absolute; left: 20px; right: 20px; top: 210px; padding: 32px 24px 22px; text-align: center; border-radius: 28px" role="alertdialog" aria-labelledby="rd" aria-describedby="rb">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: 0 auto 18px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="rd" class="serif" style="font-size: 28px; line-height: 1.15; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 8px">Approved and published</h2>
    <p id="rb" style="margin: 0; color: var(--muted); font-size: 15px">This version is now live on the Published page.</p>
    <div style="margin: 18px 0 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; text-align: left">
      <div class="serif" style="font-size: 16px; font-weight: 600; line-height: 1.3">Solid-State Batteries: What Changes for Electric Cars</div>
      <div class="small" style="margin-top: 2px">143 words · 3 sources</div>
    </div>
    <div style="display: grid; gap: 10px; margin-top: 20px">
      <a class="m-btn primary" href="MobilePosts.dc.html">View in Published</a>
      <a class="m-btn secondary" href="MobileHome.dc.html">Start another</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
