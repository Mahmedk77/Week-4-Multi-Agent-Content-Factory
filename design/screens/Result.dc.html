<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Result</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./base.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="min-height: 620px">
  <header class="nav">
    <a class="brand" href="Main.dc.html"><span class="brand-mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 11.5L8 4l5.5 7.5"/><circle cx="2.5" cy="11.5" r="1.2" fill="currentColor"/><circle cx="8" cy="4" r="1.2" fill="currentColor"/><circle cx="13.5" cy="11.5" r="1.2" fill="currentColor"/></svg></span>Draftloom</a>
    <nav class="nav-links" aria-label="Main">
      <a class="nav-link on" href="Main.dc.html" aria-current="page">New</a>
      <a class="nav-link" href="Posts.dc.html">Published</a>
      <a class="nav-link" href="PostsEmpty.dc.html">Drafts</a>
    </nav>
  </header>

  <main class="page" style="padding-top: 48px; padding-bottom: 56px; max-width: 760px">
    <ol class="flat" style="display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; padding: 12px 18px; list-style: none; margin: 0 0 28px; font-size: 14px" aria-label="Pipeline summary">
      <li style="display: inline-flex; gap: 8px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Researcher</li>
      <li style="display: inline-flex; gap: 8px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Writer</li>
      <li style="display: inline-flex; gap: 8px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Critic</li>
      <li style="display: inline-flex; gap: 8px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Rewriter</li>
      <li style="display: inline-flex; gap: 8px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Your review</li>
    </ol>

    <section class="card" style="padding: 48px 40px; text-align: center" role="status">
      <sc-if value="{{isPublished}}" hint-placeholder-val="{{ true }}">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: 0 auto 24px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </sc-if>
      <sc-if value="{{isDraft}}" hint-placeholder-val="{{ false }}">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--surface2); color: var(--ink); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 24px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg></div>
      </sc-if>
      <h1 class="serif" style="font-size: 40px; line-height: 1.1; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 12px">{{heading}}</h1>
      <p class="lede" style="margin: 0 auto; font-size: 17px">{{body}}</p>

      <div style="margin: 28px auto 0; max-width: 480px; text-align: left; padding: 16px 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px">
        <div class="serif" style="font-size: 19px; font-weight: 600; line-height: 1.3">Solid-State Batteries: What Changes for Electric Cars</div>
        <div class="small" style="margin-top: 4px">143 words · 3 sources</div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px">
        <a class="btn btn-primary" href="{{listHref}}">{{listLabel}}</a>
        <a class="btn btn-secondary" href="Main.dc.html">Start another</a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["published","draft"],"default":"published"},"$preview":{"width":1280,"height":620}}'>
class Component extends DCLogic {
renderVals() {
const draft = this.props.outcome === 'draft';
return {
isPublished: !draft,
isDraft: draft,
heading: draft ? 'Saved as a draft' : 'Approved and published',
body: draft ? "Not published. Your edited version is saved in Drafts." : 'This version is now live on the Published page.',
listLabel: draft ? 'View in Drafts' : 'View in Published',
listHref: draft ? 'PostsEmpty.dc.html' : 'Posts.dc.html'
};
}
}
</script>
</body>
</html>
