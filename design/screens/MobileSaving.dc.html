<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile saving</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="m-root">
  <dc-import name="MobileReview" hint-size="390px,844px"></dc-import>
  <div class="m-actionbar" style="display: block; padding: 14px 16px 24px; min-height: 196px">
    <button type="button" class="m-btn primary" disabled aria-busy="true" style="opacity: 0.85"><span class="spin" style="border-color: color-mix(in srgb, var(--accent-ink) 30%, transparent); border-top-color: var(--accent-ink)" aria-hidden="true"></span>Saving…</button>
    <button type="button" class="m-btn secondary" disabled style="margin-top: 10px; opacity: 0.55">Reject</button>
    <p class="small" style="margin: 12px 0 0; text-align: center">Saving your version. Editing is paused.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
