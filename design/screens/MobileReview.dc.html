<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile review</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="m-root">
  <div class="m-top">
    <button type="button" class="m-icon-btn" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="eyebrow" style="margin: 0">Waiting for your review</span>
    <button type="button" class="m-icon-btn" aria-label="Switch to dark theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
  </div>

  <main class="m-pad" style="padding-top: 8px">
    <h1 class="m-h1" style="font-size: 26px">Review the draft</h1>
    <div class="m-hscroll" style="margin-top: 12px">
      <span class="chip chip-ok" style="padding: 6px 12px">Researcher ✓</span>
      <span class="chip chip-ok" style="padding: 6px 12px">Writer ✓</span>
      <span class="chip chip-ok" style="padding: 6px 12px">Critic ✓</span>
      <span class="chip chip-ok" style="padding: 6px 12px">Rewriter ✓</span>
    </div>

    <section class="m-card" style="margin-top: 14px; overflow: hidden" aria-label="Draft">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line)">
        <span class="small mono" aria-live="polite">143 words</span>
        <div class="seg" role="group" aria-label="View">
          <button type="button" class="on" aria-pressed="true" style="min-height: 40px; padding: 0 18px">Edit</button>
          <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 18px">Preview</button>
        </div>
      </div>
      <label for="draft" style="position: absolute; left: -9999px">Draft text (markdown)</label>
      <textarea class="editor" id="draft" rows="11" style="padding: 16px; font-size: 13.5px"># Solid-State Batteries: What Changes for Electric Cars

Solid-state batteries replace the liquid electrolyte in today's lithium-ion cells with a solid material. That swap promises higher energy density, faster charging and a lower risk of fire, which is why most major automakers are racing to bring them to market.

Prototype cells have shown ranges of more than 900 km in testing, though real-world figures will depend on pack design and vehicle weight.</textarea>
    </section>

    <button type="button" style="margin-top: 12px; width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--ink); text-align: left; cursor: pointer; font: inherit">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.1"/></svg>
      <span style="flex: 1; line-height: 1.3"><strong style="display: block; font-size: 15px">2 factual issues</strong><span class="small" style="color: var(--ink)">Issues found in the first draft</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </main>

  <div class="m-actionbar" style="display: block; padding: 14px 16px 24px">
    <button type="button" class="m-btn primary">Approve</button>
    <button type="button" class="m-btn secondary" style="margin-top: 10px">Reject</button>
    <p class="small" style="margin: 12px 0 0; text-align: center">Not ready? Rejecting saves your version to Drafts.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
